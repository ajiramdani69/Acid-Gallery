name: Build Acid Gallery APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Google login bridge
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Upgrade Android Gradle Plugin and SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sed -i 's/com.android.tools.build:gradle:8.7.2/com.android.tools.build:gradle:8.9.1/g' android/build.gradle
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/variables.gradle
          sed -i 's/gradle-8.*/gradle-8.11.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure Google login activity
        run: |
          mkdir -p android/app/src/main/java/id/acidgallery/app
          cat > android/app/src/main/java/id/acidgallery/app/MainActivity.java <<'EOF'
          package id.acidgallery.app;

          import android.content.Intent;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginHandle;
          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;

          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {
            @Override
            public void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN &&
                  requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                PluginHandle handle = getBridge().getPlugin("SocialLogin");
                if (handle != null) {
                  Plugin plugin = handle.getInstance();
                  if (plugin instanceof SocialLoginPlugin) {
                    ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
                  }
                }
              }
            }

            @Override
            public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Acid-Gallery-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
